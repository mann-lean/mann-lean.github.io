# This file controls the global layout, themes, and navigation bar of your website. 
project:
  type: website
  output-dir: "docs"   # Tells Quarto to output final files into a "docs" folder

website:
  title: "Mann"
  favicon: "assets/fv.png"
  
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: pages/about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: pages/cv.qmd
        text: Résumé
      - href: pages/contact.qmd
        text: Contact

  page-footer:       # Aligned directly under 'website:'
    center: "© Mann. 2026."
         
format:
  html:
    theme:      # Try clean technical themes like cosmo, flatly, or slate
      light: [flatly,css/styles.scss]
      dark: [darkly,css/styles.scss] 